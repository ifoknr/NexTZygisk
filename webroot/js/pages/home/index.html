        <div id="home_updated" class="nz_header_sub">&nbsp;</div>
      </div>
    </div>
    <button id="home_refresh" class="nz_icon_btn" aria-label="Refresh"></button>
  </div>

  <!-- INFO: Hero status card -->
  <div id="home_hero" class="nz_card nz_hero" data-status="unknown">
    <div class="nz_ring">
      <svg viewBox="0 0 100 100">
        <circle class="nz_ring_track" cx="50" cy="50" r="42"></circle>
        <circle id="home_ring_value" class="nz_ring_value" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle>
      </svg>
      <div id="home_ring_icon" class="nz_ring_center"></div>
    </div>
    <div style="min-width: 0;">
      <div id="home_status_title" class="nz_hero_title nz_skeleton" style="width: 140px;">&nbsp;</div>
      <div id="home_status_sub" class="nz_hero_sub">&nbsp;</div>
      <div id="home_status_pills" class="nz_hero_pills"></div>
    </div>
    <!-- INFO: Only shown on wide screens -->
    <div id="home_hero_stats" class="nz_hero_stats"></div>
  </div>

  <div id="home_issues"></div>

  <!-- INFO: One column on phones, two columns on tablets -->
  <div class="nz_cols">
    <div class="nz_col">
      <div id="home_components_title" class="nz_section">{{components.title}}</div>
      <div id="home_components" class="nz_grid"></div>

      <div class="nz_section">{{hiding.title}}</div>
      <div id="home_hiding" class="nz_grid"></div>

      <div class="nz_wide_only">
        <div class="nz_section">
          <span>{{components.modules}}</span>
          <span id="home_modules_all" class="nz_section_action">{{components.viewAll}}</span>
        </div>
        <div id="home_modules" class="nz_card nz_home_modules"></div>
      </div>
    </div>

    <div class="nz_col">
      <div class="nz_section">
        <span>{{device.title}}</span>
        <span id="home_copy_device" class="nz_section_action">{{copy}}</span>
      </div>
      <div id="home_device" class="nz_card"></div>

      <div class="nz_wide_only">
        <div id="home_tools_title" class="nz_section">&nbsp;</div>
        <div id="home_tools" class="nz_grid"></div>
      </div>
    </div>
  </div>
</div>
