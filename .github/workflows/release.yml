name: Release

# INFO: Publishes a GitHub Release with the release and debug zips.
#         - Actions > Release > Run workflow (on main), or
#         - push a tag named v* (for example: git tag v1.0.0 && git push origin v1.0.0)
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release (not yet tested on devices)"
        type: boolean
        default: true
  push:
    tags: [ "v*" ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup keys
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Signing keys are not set, building unsigned zips."
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: make all -j$(nproc)

      - name: Collect version
        id: version
        run: |
          VER_NAME=$(sed -n 's/^VER_NAME ?= //p' common.mk)
          VER_CODE=$(git rev-list HEAD --count)
          COMMIT=$(git rev-parse --short HEAD)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE=false
          else
            TAG="${VER_NAME}-${VER_CODE}"
            PRERELEASE="${{ inputs.prerelease }}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          SUFFIX=""
          [ "$PRERELEASE" = true ] && SUFFIX=" (test)"
          echo "name=NextZygisk ${VER_NAME} (${VER_CODE}-${COMMIT})${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "zip=NextZygisk-${VER_NAME}-${VER_CODE}-${COMMIT}-release.zip" >> "$GITHUB_OUTPUT"
          echo "ver_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "ver_code=${VER_CODE}" >> "$GITHUB_OUTPUT"

          ls -la build/out

      - name: Write release notes
        run: |
          VER_NAME=$(sed -n 's/^VER_NAME ?= //p' common.mk)
          {
            echo '> [!WARNING]'
            echo '> **Personal project, use at your own risk.** Keep a way to boot without modules (safe mode) before installing.'
            echo
            echo '## Changes'
            echo
            awk -v v="## $VER_NAME" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md
            echo
          } > release-notes.md
          cat >> release-notes.md <<'EOF'
          ## Download

          - **`NextZygisk-…-release.zip`**: use this one.
          - **`NextZygisk-…-debug.zip`**: verbose logs, only to collect logs for a bug report.

          Install it from KernelSU / ReSukiSU / Magisk / APatch → Modules → Install from storage, then reboot.
          Magisk users: turn off Magisk's built-in Zygisk first.

          See the [README](https://github.com/${{ github.repository }}#readme) for details,
          and attach the diagnostics report (WebUI → Actions → Export diagnostics) to any issue.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            build/out/NextZygisk-v*-release.zip
            build/out/NextZygisk-v*-debug.zip
          fail_on_unmatched_files: true

      # INFO: Releases created with GITHUB_TOKEN do not trigger other workflows, so
      #         telegram-notify.yml never sees them. Post to the channel from here.
      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          # Optional: the topic (message_thread_id) inside a group with topics.
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          TAG: ${{ steps.version.outputs.tag }}
          VER_NAME: ${{ steps.version.outputs.ver_name }}
          PRE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_TO" ]; then
            echo "Telegram secrets are not set, skipping."
            exit 0
          fi
          {
            if [ "$PRE" = true ]; then
              echo "🧪 إصدار تجريبي (للاختبار فقط)"
            else
              echo "🚀 تحديث جديد تم إطلاقه!"
            fi
            echo
            echo "📦 الأداة/الموديول: ${GITHUB_REPOSITORY#*/}"
            echo "🏷️ الإصدار: $TAG"
            echo
            echo "📝 ما الجديد؟"
            awk -v v="## $VER_NAME" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md | head -n 40
            echo
            echo "🔗 رابط التحميل المباشر:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } > telegram.txt
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_TO" \
            ${TELEGRAM_TOPIC:+-d message_thread_id=$TELEGRAM_TOPIC} \
            --data-urlencode "text@telegram.txt" \
            -d disable_web_page_preview=true > /dev/null
          echo "Sent to Telegram."

      # INFO: Point update.json (module.prop: updateJson) at this release, so root managers
      #         offer it as an update. Skipped for pre-releases.
      - name: Update update.json
        if: steps.version.outputs.prerelease != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.version.outputs.zip }}
          VER_NAME: ${{ steps.version.outputs.ver_name }}
          VER_CODE: ${{ steps.version.outputs.ver_code }}
        run: |
          git fetch origin main
          git checkout -B update-json origin/main
          cat > update.json <<EOF
          {
            "version": "${VER_NAME} (${VER_CODE})",
            "versionCode": ${VER_CODE},
            "zipUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}",
            "changelog": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/CHANGELOG.md"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update.json for ${TAG}" && git push origin HEAD:main || echo "update.json unchanged"
